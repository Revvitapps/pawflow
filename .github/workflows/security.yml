name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informational: surfaces all advisories, including highs that are
      # transitive through Next.js itself (postcss/sharp) and cannot be fixed
      # without a breaking framework downgrade. Non-blocking so those known,
      # framework-owned advisories don't wedge every PR.
      - name: npm audit (report)
        run: npm audit --omit=dev || true

      # Blocking gate: fail the build only on CRITICAL advisories, which are
      # actionable in our own dependency tree.
      - name: npm audit (gate on critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          # Never migrate a real database from CI. `npm run build` is plain
          # `next build`; these placeholders satisfy client generation only.
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DATABASE_URL_UNPOOLED: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-placeholder-not-a-real-secret"
